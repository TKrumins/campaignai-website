<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none" role="img" aria-label="Turnaround time shrinking as the platform learns each campaign across five videos">
  <title>Speed compounds with every video</title>
  <!-- axes -->
  <line x1="52" y1="24" x2="52" y2="196" stroke="#B8B8B8" stroke-width="2"/>
  <line x1="52" y1="196" x2="452" y2="196" stroke="#B8B8B8" stroke-width="2"/>

  <!-- shrinking turnaround bars (time per video going down) -->
  <g>
    <rect x="76" y="80" width="34" height="116" rx="4" fill="#FF3366" opacity="0.85"/>
    <rect x="148" y="108" width="34" height="88" rx="4" fill="#B45CE0" opacity="0.85"/>
    <rect x="220" y="130" width="34" height="66" rx="4" fill="#8E5CF7" opacity="0.85"/>
    <rect x="292" y="148" width="34" height="48" rx="4" fill="#6E7DF2" opacity="0.85"/>
    <rect x="364" y="162" width="34" height="34" rx="4" fill="#4D9FFF" opacity="0.9"/>
  </g>

  <!-- compounding speed curve rising as bars fall -->
  <path d="M93 150 C 150 120, 210 96, 265 78 S 360 46, 405 36" stroke="#00D084" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="93" cy="150" r="5" fill="#00D084"/>
  <circle cx="165" cy="112" r="5" fill="#00D084"/>
  <circle cx="237" cy="90" r="5" fill="#00D084"/>
  <circle cx="309" cy="66" r="5" fill="#00D084"/>
  <circle cx="405" cy="36" r="6" fill="#00D084"/>
  <path d="M405 20 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 z" fill="#00D084"/>

  <!-- x labels -->
  <g font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2C2C2C">
    <text x="93" y="216">1</text>
    <text x="165" y="216">2</text>
    <text x="237" y="216">3</text>
    <text x="309" y="216">4</text>
    <text x="381" y="216">5</text>
  </g>
  <text x="252" y="234" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#666666">Video number</text>
  <text x="30" y="112" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#666666" transform="rotate(-90 30 112)">Turnaround</text>
</svg>
