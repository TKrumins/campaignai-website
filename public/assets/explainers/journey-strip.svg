<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" fill="none" role="img" aria-label="Six-step journey from booking a call to owning your finished video">
  <title>How it works, in six steps</title>
  <!-- connecting tri-color track -->
  <line x1="60" y1="44" x2="660" y2="44" stroke="#E8F4F8" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="44" x2="660" y2="44" stroke="url(#js-track)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22"/>

  <g font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <!-- Node helper positions: 60,180,300,420,540,660 -->
    <g>
      <circle cx="60" cy="44" r="16" fill="#FF3366"/>
      <text x="60" y="48" fill="#E8F4F8">1</text>
      <text x="60" y="80" fill="#2C2C2C">Book</text>
    </g>
    <g>
      <circle cx="180" cy="44" r="16" fill="#B45CE0"/>
      <text x="180" y="48" fill="#E8F4F8">2</text>
      <text x="180" y="80" fill="#2C2C2C">Plan</text>
    </g>
    <g>
      <circle cx="300" cy="44" r="16" fill="#8E5CF7"/>
      <text x="300" y="48" fill="#E8F4F8">3</text>
      <text x="300" y="80" fill="#2C2C2C">Script</text>
    </g>
    <g>
      <circle cx="420" cy="44" r="16" fill="#6E7DF2"/>
      <text x="420" y="48" fill="#E8F4F8">4</text>
      <text x="420" y="80" fill="#2C2C2C">Submit</text>
    </g>
    <g>
      <circle cx="540" cy="44" r="16" fill="#4D9FFF"/>
      <text x="540" y="48" fill="#E8F4F8">5</text>
      <text x="540" y="80" fill="#2C2C2C">We polish</text>
    </g>
    <g>
      <circle cx="660" cy="44" r="16" fill="#00D084"/>
      <path d="M653 44 l4 4 8 -8" stroke="#E8F4F8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="660" y="80" fill="#2C2C2C">You own it</text>
    </g>
  </g>

  <defs>
    <linearGradient id="js-track" x1="60" y1="44" x2="660" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3366"/>
      <stop offset="0.5" stop-color="#8E5CF7"/>
      <stop offset="1" stop-color="#4D9FFF"/>
    </linearGradient>
  </defs>
</svg>
