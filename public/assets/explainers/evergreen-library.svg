<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" fill="none" role="img" aria-label="One video growing into a library of four campaign video types">
  <title>An evergreen video library</title>
  <!-- Single seed card -->
  <g>
    <rect x="24" y="66" width="104" height="68" rx="10" fill="#0D1B3E"/>
    <path d="M65 88 l22 12 -22 12 z" fill="#E8F4F8"/>
    <rect x="40" y="120" width="72" height="6" rx="3" fill="#4D9FFF" opacity="0.6"/>
  </g>

  <!-- growth arrow, tri-color -->
  <path d="M140 100 h44" stroke="url(#el-arrow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M178 92 l12 8 -12 8" stroke="#4D9FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M160 74 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 z" fill="#00D084"/>

  <!-- Four-type row -->
  <g font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <!-- Announcement -->
    <rect x="204" y="60" width="68" height="80" rx="9" fill="#E8F4F8" stroke="#FF3366" stroke-width="2"/>
    <circle cx="238" cy="86" r="12" fill="#FF3366" opacity="0.9"/>
    <path d="M233 86 l3 3 6 -6" stroke="#E8F4F8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="238" y="124" fill="#0D1B3E">Announce</text>

    <!-- Explainer -->
    <rect x="280" y="60" width="68" height="80" rx="9" fill="#E8F4F8" stroke="#8E5CF7" stroke-width="2"/>
    <rect x="298" y="78" width="32" height="5" rx="2.5" fill="#8E5CF7"/>
    <rect x="298" y="88" width="24" height="5" rx="2.5" fill="#8E5CF7" opacity="0.6"/>
    <rect x="298" y="98" width="28" height="5" rx="2.5" fill="#8E5CF7" opacity="0.4"/>
    <text x="314" y="124" fill="#0D1B3E">Explain</text>

    <!-- Fundraising -->
    <rect x="356" y="60" width="68" height="80" rx="9" fill="#E8F4F8" stroke="#00D084" stroke-width="2"/>
    <text x="390" y="94" fill="#00D084" font-size="22" font-weight="800">$</text>
    <text x="390" y="124" fill="#0D1B3E">Fund</text>

    <!-- GOTV -->
    <rect x="432" y="60" width="68" height="80" rx="9" fill="#E8F4F8" stroke="#4D9FFF" stroke-width="2"/>
    <path d="M466 76 l8 10 -6 0 0 12 -4 0 0 -12 -6 0 z" fill="#4D9FFF"/>
    <text x="466" y="124" fill="#0D1B3E">Vote</text>
  </g>

  <defs>
    <linearGradient id="el-arrow" x1="140" y1="100" x2="190" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3366"/>
      <stop offset="0.5" stop-color="#8E5CF7"/>
      <stop offset="1" stop-color="#4D9FFF"/>
    </linearGradient>
  </defs>
</svg>
